<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region Battle — TokFlow</title>
<style>
  :root{
    --gold:#f0c469; --gold-dim:#8a6d33; --ink:#05060a;
    --ui:-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  body{ font-family:var(--ui); color:#fff; -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; }
  /* Portrait 9:16 frame — this is exactly what LIVE Studio captures. */
  #frame{ position:relative; aspect-ratio:9/16; height:100vh; max-width:100vw;
    overflow:hidden; background:var(--ink); }
  #stage{ position:absolute; inset:0; }
  canvas{ display:block; width:100%; height:100%; }

  /* ── column name plates, projected from 3D ── */
  #tags{ position:absolute; inset:0; pointer-events:none; z-index:4; }
  .tag{ position:absolute; top:0; left:0; text-align:center; will-change:transform; }
  .tag b{ display:block; font-size:9px; font-weight:800; letter-spacing:.6px;
    color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.9); }
  .tag i{ display:block; margin-top:1px; font-size:11px; font-weight:800; font-style:normal;
    color:var(--tc); font-variant-numeric:tabular-nums; text-shadow:0 2px 8px rgba(0,0,0,.9); }

  /* ── broadcast overlay ── */
  .ovl{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  .topbar{ position:absolute; top:0; left:0; right:0; padding:22px 26px 0;
    display:flex; justify-content:space-between; align-items:flex-start; }
  .live{ display:flex; align-items:center; gap:8px; padding:7px 14px 7px 11px; border-radius:3px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(16px); }
  .live i{ width:7px; height:7px; border-radius:50%; background:#ff3b30; box-shadow:0 0 10px #ff3b30;
    animation:beat 1.5s ease-in-out infinite; }
  @keyframes beat{ 50%{ opacity:.3; transform:scale(.8); } }
  .live b{ font-size:10px; font-weight:800; letter-spacing:2.2px; }
  .clock{ text-align:right; }
  .clock .t{ font-size:34px; font-weight:200; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
    line-height:.9; text-shadow:0 4px 24px rgba(0,0,0,.7); }
  .clock .l{ font-size:8.5px; font-weight:800; letter-spacing:2.6px; color:var(--gold); margin-top:5px; }

  .title{ position:absolute; top:78px; left:0; right:0; text-align:center; }
  .title .kick{ font-size:9px; font-weight:800; letter-spacing:5px; color:var(--gold);
    opacity:0; animation:fadeUp .9s .3s cubic-bezier(.16,1,.3,1) forwards; }
  .title h1{ margin-top:9px; font-size:38px; font-weight:250; letter-spacing:-.045em; line-height:.94;
    text-shadow:0 6px 40px rgba(0,0,0,.85); opacity:0;
    animation:fadeUp 1.1s .45s cubic-bezier(.16,1,.3,1) forwards; }
  .title h1 b{ font-weight:700; background:linear-gradient(180deg,#fff8e6,#e8bd63 62%,#b98c34);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .title .rule{ width:0; height:1px; margin:14px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:rule 1.2s .8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  @keyframes rule{ to{ width:216px; } }

  /* leader lower-third */
  .lead{ position:absolute; left:26px; bottom:132px; display:flex; align-items:stretch;
    opacity:0; transform:translateX(-24px); animation:slideIn .9s 1.2s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes slideIn{ to{ opacity:1; transform:none; } }
  .lead .bar{ width:3px; background:linear-gradient(180deg,var(--gold),transparent); }
  .lead .box{ padding:11px 20px 12px 15px;
    background:linear-gradient(90deg,rgba(10,12,18,.88),rgba(10,12,18,.36));
    backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,.10); }
  .lead .lab{ font-size:8px; font-weight:800; letter-spacing:2.8px; color:var(--gold); }
  .lead .nm{ font-size:23px; font-weight:600; letter-spacing:-.03em; margin-top:3px; line-height:1; }
  .lead .pt{ font-size:11px; font-weight:600; opacity:.62; margin-top:5px; font-variant-numeric:tabular-nums; }

  /* rank rail */
  .rail{ position:absolute; right:24px; top:170px; width:174px; display:flex; flex-direction:column; gap:4px; }
  .rk{ display:flex; align-items:center; gap:9px; padding:7px 11px 7px 9px; border-radius:2px;
    background:linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.055));
    border-left:2px solid var(--rc); opacity:0; transform:translateX(16px);
    animation:slideIn .7s cubic-bezier(.16,1,.3,1) forwards;
    transition:background .3s; }
  .rk .n{ font-size:9px; font-weight:800; opacity:.42; width:11px; font-variant-numeric:tabular-nums; }
  .rk .r{ flex:1; font-size:11px; font-weight:650; letter-spacing:-.01em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .rk .v{ font-size:11px; font-weight:750; font-variant-numeric:tabular-nums; color:var(--rc); }
  .rk.up{ background:linear-gradient(90deg,rgba(255,255,255,.04),var(--rc)26); }

  /* gift legend */
  .gifts{ position:absolute; left:0; right:0; bottom:0; padding:16px 20px 20px;
    background:linear-gradient(180deg,transparent,rgba(3,4,7,.92) 42%); pointer-events:auto; }
  .gifts .cap{ text-align:center; font-size:8.5px; font-weight:800; letter-spacing:3px;
    color:rgba(255,255,255,.42); margin-bottom:11px; }
  .grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:7px; max-width:760px; margin:0 auto; }
  .g{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:9px 3px 7px; border-radius:3px; cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.09); border-top:1.5px solid var(--gc);
    transition:transform .18s cubic-bezier(.34,1.5,.64,1), background .18s, box-shadow .18s; }
  .g:hover{ transform:translateY(-3px); background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    box-shadow:0 8px 22px -6px var(--gc); }
  .g:active{ transform:translateY(-1px) scale(.97); }
  .g svg{ width:24px; height:24px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  .g .rn{ font-size:8px; font-weight:800; letter-spacing:.3px; color:var(--gc); }
  .g .gn{ font-size:7px; font-weight:650; opacity:.5; }

  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6;
    mix-blend-mode:overlay; }
  /* portrait proportions: rank rail sits under the stage, gifts across the base */
  .rail{ right:18px; top:auto; bottom:196px; width:150px; }
  .lead{ left:18px; bottom:196px; }
  .grid{ grid-template-columns:repeat(4,1fr); max-width:none; }
  .title h1{ font-size:34px; }
</style>
</head>
<body>
  <div id="frame">
  <div id="stage"></div>
  <div id="tags"></div>
  <div class="flash" id="flash"></div>

  <div class="ovl">
    <div class="topbar">
      <div class="live"><i></i><b>LIVE</b></div>
      <div class="clock"><div class="t" id="clock">04:52</div><div class="l">ROUND 1</div></div>
    </div>

    <div class="title">
      <div class="kick">TOKFLOW PRESENTS</div>
      <h1>REGION <b>BATTLE</b></h1>
      <div class="rule"></div>
    </div>

    <div class="lead">
      <span class="bar"></span>
      <div class="box">
        <div class="lab">LEADING</div>
        <div class="nm" id="leadName">AMHARA</div>
        <div class="pt" id="leadPts">8,240 POINTS</div>
      </div>
    </div>

    <div class="rail" id="rail"></div>

    <div class="gifts">
      <div class="cap">SEND YOUR REGION'S GIFT TO SCORE</div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  </div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
