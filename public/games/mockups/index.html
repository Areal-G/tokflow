<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Region Battle — look mockups</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden;
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif; color:#fff; }
  body{ display:grid; place-items:center; }
  #frame{ position:relative; aspect-ratio:9/16; height:100vh; max-width:100vw; overflow:hidden; background:#05060a; }
  canvas{ display:block; width:100%; height:100%; }

  /* ── style switcher ── */
  .picker{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; gap:6px; padding:6px; border-radius:99px;
    background:rgba(18,20,26,.86); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px); }
  .picker button{ padding:8px 16px; border:0; border-radius:99px; cursor:pointer;
    background:transparent; color:rgba(255,255,255,.6); font:inherit; font-size:12px; font-weight:650;
    letter-spacing:.2px; transition:.18s; }
  .picker button:hover{ color:#fff; }
  .picker button.on{ background:#fff; color:#0b0c10; }

  /* ── broadcast overlay ── */
  .ovl{ position:absolute; inset:0; pointer-events:none; z-index:6; }
  .top{ position:absolute; top:0; left:0; right:0; padding:64px 20px 0;
    display:flex; justify-content:space-between; align-items:flex-start; }
  .lv{ display:flex; align-items:center; gap:7px; font-size:9px; font-weight:800; letter-spacing:2px; }
  .lv i{ width:6px; height:6px; border-radius:50%; background:#ff3b30; box-shadow:0 0 9px #ff3b30;
    animation:bp 1.5s ease-in-out infinite; }
  @keyframes bp{ 50%{ opacity:.25; } }
  .ck{ font-size:26px; font-weight:200; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
    text-shadow:0 3px 20px rgba(0,0,0,.8); }

  .ttl{ position:absolute; top:112px; left:0; right:0; text-align:center; }
  .ttl .k{ font-size:8px; font-weight:800; letter-spacing:4.5px; color:#e8c579; }
  .ttl h1{ margin-top:7px; font-size:29px; font-weight:200; letter-spacing:-.04em; line-height:1;
    text-shadow:0 4px 30px rgba(0,0,0,.9); }
  .ttl h1 b{ font-weight:700; }

  .lead{ position:absolute; left:18px; bottom:150px; }
  .lead .l{ font-size:7.5px; font-weight:800; letter-spacing:2.6px; color:#e8c579; }
  .lead .n{ font-size:26px; font-weight:600; letter-spacing:-.035em; line-height:1; margin-top:3px;
    text-shadow:0 3px 22px rgba(0,0,0,.9); }
  .lead .p{ font-size:11px; font-weight:600; opacity:.6; margin-top:4px; font-variant-numeric:tabular-nums; }

  #tags{ position:absolute; inset:0; z-index:5; pointer-events:none; }
  .tag{ position:absolute; top:0; left:0; transform:translate(-50%,-50%); text-align:center;
    transition:opacity .3s; will-change:transform; }
  .tag b{ display:block; font-size:8.5px; font-weight:800; letter-spacing:.5px;
    text-shadow:0 2px 7px rgba(0,0,0,.95); }
  .tag i{ display:block; font-size:10px; font-weight:800; font-style:normal;
    font-variant-numeric:tabular-nums; text-shadow:0 2px 7px rgba(0,0,0,.95); }

  .gifts{ position:absolute; left:0; right:0; bottom:0; z-index:7; padding:14px 12px 16px;
    background:linear-gradient(180deg,transparent,rgba(3,4,7,.94) 44%); pointer-events:auto; }
  .gifts .c{ text-align:center; font-size:8px; font-weight:800; letter-spacing:2.6px;
    color:rgba(255,255,255,.4); margin-bottom:9px; }
  .gr{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
  .g{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px 6px;
    border-radius:4px; cursor:pointer; border:1px solid rgba(255,255,255,.09);
    border-top:1.5px solid var(--gc); background:rgba(255,255,255,.045);
    transition:transform .16s cubic-bezier(.34,1.5,.64,1), background .16s; }
  .g:hover{ transform:translateY(-3px); background:rgba(255,255,255,.11); }
  .g:active{ transform:scale(.96); }
  .g svg{ width:21px; height:21px; }
  .g b{ font-size:7.5px; font-weight:800; color:var(--gc); }
  .g i{ font-size:6.5px; font-style:normal; font-weight:650; opacity:.5; }
  .note{ position:fixed; bottom:8px; left:50%; transform:translateX(-50%); z-index:30;
    font-size:10.5px; color:rgba(255,255,255,.34); }
</style>
</head>
<body>
  <div class="picker">
    <button data-s="0" class="on">Extruded Map</button>
    <button data-s="1">Molten Metal</button>
    <button data-s="2">Liquid Glass</button>
  </div>

  <div id="frame">
    <canvas id="cv"></canvas>
    <div id="tags"></div>
    <div class="ovl">
      <div class="top"><span class="lv"><i></i>LIVE</span><span class="ck" id="ck">04:52</span></div>
      <div class="ttl"><div class="k">TOKFLOW</div><h1>REGION <b>BATTLE</b></h1></div>
      <div class="lead"><div class="l">LEADING</div><div class="n" id="ln">AMHARA</div><div class="p" id="lp">8,240 POINTS</div></div>
    </div>
    <div class="gifts">
      <div class="c">SEND YOUR REGION'S GIFT</div>
      <div class="gr" id="gr"></div>
    </div>
  </div>
  <div class="note">click a gift to fire it · switch styles above</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./mockups.js"></script>
</body>
</html>
