<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokFlow LIVE Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="eyebrow">TOKFLOW</div>
    <h1>LIVE Reader</h1>
    <div class="status" id="status" data-state="offline">
      <span class="dot"></span>
      <div><strong id="statusLabel">ENGINE OFFLINE</strong><small id="statusMessage">Start the local LIVE engine.</small></div>
    </div>
    <label for="username">TikTok LIVE username</label>
    <div class="username"><span>@</span><input id="username" autocomplete="off" spellcheck="false" placeholder="fetty_bae46"></div>
    <div class="actions">
      <button id="connect" class="primary">Connect LIVE</button>
      <button id="stop">Stop</button>
    </div>
    <button id="testGift" class="test">Test Rose Gift · +10 Doro</button>
    <div class="capture" id="captureRow" hidden>
      <span class="capture-dot"></span>
      <span id="captureInfo"></span>
    </div>
    <button id="dashboard" class="link">Open activity dashboard →</button>
    <p class="privacy">Runs locally. No TikTok password or cookie is copied.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
